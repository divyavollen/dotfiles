- name: Download VSCode .deb package
  ansible.builtin.get_url:
    url: 'https://go.microsoft.com/fwlink/?LinkID=760868'
    dest: '/tmp/code.deb'
    mode: '0644'
  changed_when: false

- name: Add Microsoft GPG key
  ansible.builtin.shell:
    cmd: "curl https://packages.microsoft.com/keys/microsoft.asc -o /etc/apt/keyrings/packages.microsoft.gpg"
    creates: /etc/apt/keyrings/packages.microsoft.gpg
  become: true

- name: Add Microsoft Repository for VSCode
  ansible.builtin.apt_repository:
    repo: deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main
    state: present

- name: Install VSCode from downloaded .deb file
  ansible.builtin.apt:
    deb: /tmp/code.deb

- name: Remove the VSCode installer
  ansible.builtin.file:
    path: /tmp/code.deb
    state: absent
  changed_when: false
